# SPDX-License-Identifier: Apache-2.0
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install bubblewrap for the sandbox tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: sh scripts/test_with_postgres.sh
  hygiene:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Check the PR's own commits, not GitHub's synthetic merge commit (authored by the PR opener).
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: commit identity and trailers
        run: |
          bad=$(git log --no-merges --format='%H %an <%ae>%n%b' origin/${{ github.base_ref }}..HEAD | grep -E 'Co-authored-by:|^[0-9a-f]{40} ' | grep -vE '^[0-9a-f]{40} Baton Contributor <contributor@example.com>$' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
