pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    map $request_id $baton_request_id {
        "~^(?<r1>[0-9a-f]{8})(?<r2>[0-9a-f]{4})(?<r3>[0-9a-f]{4})(?<r4>[0-9a-f]{4})(?<r5>[0-9a-f]{12})$" "$r1-$r2-$r3-$r4-$r5";
        default $request_id;
    }
    log_format baton escape=json '{"time":"$time_iso8601","request_id":"$baton_request_id","method":"$request_method","status":$status,"duration":$request_time}';
    access_log /dev/stdout baton;
    # The unauthenticated card and key-set documents are limited per client address; the bridge adds a global backstop.
    limit_req_zone $binary_remote_addr zone=baton_public_docs:1m rate=10r/s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    # Docker's embedded DNS. Upstream names are resolved per request (TTL-capped),
    # so a recreated gateway is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server {
        listen 8443 ssl;
        ssl_certificate /tls/fullchain.pem;
        ssl_certificate_key /tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        server_name _;
        client_max_body_size 128k;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        location = / { return 302 /board; }
        location = /board { alias /usr/share/nginx/html/index.html; default_type text/html; }
        # The public Agent Card and its key set carry no secret and are cached by clients. Re-declaring any add_header here
        # drops the server-level Cache-Control: no-store, so the bridge's own Cache-Control (max-age on 200, no-store on errors) reaches the client.
        location ~ ^/\.well-known/(agent-card|jwks)\.json$ {
            limit_req zone=baton_public_docs burst=20 nodelay;
            limit_req_status 429;
            add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            proxy_pass http://gateway:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $baton_request_id;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
        # HTTP /v1/space, MCP, and board data all pass through gateway client ACL.
        location / {
            set $upstream http://gateway:3000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $baton_request_id;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 370s;
            proxy_send_timeout 370s;
        }
    }
}
