name: ${COMPOSE_PROJECT_NAME:-baton}
x-service: &service
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "5"}
x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-baton}-app:local
  pull_policy: never
x-app-build: &app-build
  context: ..
  dockerfile: deploy/Dockerfile
x-admin-volumes: &admin-volumes
  - config:/runtime/config
  - bridge-secrets:/runtime/secrets/bridge
  - database-admin-secrets:/runtime/secrets/database-admin
  - database-app-secrets:/runtime/secrets/database-app
  - codex-home:/runtime/secrets/codex-home
  - client-secrets:/runtime/secrets/clients
  - bridge-data:/runtime/data/bridge
  - codex-data:/runtime/data/codex
  - postgres-data:/runtime/data/postgres
services:
  initialize:
    <<: [*service, *app]
    build: *app-build
    restart: "no"
    user: "0:0"
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    command: [python, scripts/tokens.py, --runtime, /runtime, init]
    volumes: *admin-volumes
    tmpfs: ["/runtime:mode=0700", "/tmp:mode=1777"]
    network_mode: none
  admin:
    <<: [*service, *app]
    profiles: [ops]
    restart: "no"
    user: "0:0"
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    entrypoint: [python, scripts/tokens.py, --runtime, /runtime]
    command: [list]
    volumes: *admin-volumes
    tmpfs: ["/runtime:mode=0700", "/tmp:mode=1777"]
    network_mode: none
  edge:
    <<: *service
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    user: "${EDGE_UID:-101}:${EDGE_GID:-101}"
    entrypoint: [nginx, -g, "daemon off;"]
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../board:/usr/share/nginx/html:ro
    tmpfs: ["/tmp:mode=1777", "/var/cache/nginx:uid=${EDGE_UID:-101},gid=${EDGE_GID:-101},mode=0700"]
    networks: [private, ingress]
    depends_on:
      gateway: {condition: service_started}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/board]
      interval: 10s
      timeout: 3s
      retries: 12
  gateway:
    <<: *service
    image: ghcr.io/agentgateway/agentgateway:v1.6.0@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
    command: [-f, /config/gateway.json]
    volumes: [config:/config:ro]
    networks: [private]
    depends_on:
      initialize: {condition: service_completed_successfully}
      bridge: {condition: service_healthy}
      codex: {condition: service_healthy}
  bridge:
    <<: [*service, *app]
    command: [python, -m, bridge.server]
    environment:
      BATON_STATE: /data
      BATON_CONFIG: /config
      BATON_DATABASE_CONFIG: /run/secrets/database.json
      GATEWAY_INTERNAL: http://gateway:3000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    volumes: [config:/config:ro, database-app-secrets:/run/secrets:ro, bridge-secrets:/run/secrets/bridge:ro, bridge-data:/data]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    networks: [private, database]
    depends_on:
      initialize: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('localhost',9000),2).close()"]
      interval: 5s
      timeout: 3s
      retries: 15
  codex:
    <<: [*service, *app]
    command: [python, -m, bridge.codex_agent]
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/codex-seccomp.json
      - apparmor=unconfined
    environment:
      BATON_STATE: /data
      BATON_CONFIG: /config
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      WORKER_MODE: ${WORKER_MODE:-codex}
      CODEX_MODEL: ${CODEX_MODEL:-}
    volumes: [config:/config:ro, codex-data:/data, codex-home:/home/agent/.codex]
    # Keep helper aliases out of the credential tree. Codex falls back to its
    # immutable executable and bundled bubblewrap; credentials remain writable
    # by the harness but inaccessible to model-generated tools.
    tmpfs: ["/tmp:size=64m,mode=1777", "/work:size=64m,uid=10001,gid=10001,mode=0700", "/home/agent/.codex/tmp:size=1m,uid=0,gid=0,mode=0555"]
    networks: [private, worker-egress]
    pids_limit: 128
    depends_on:
      initialize: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('localhost',9001),2).close()"]
      interval: 5s
      timeout: 3s
      retries: 15
  database:
    <<: *service
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    user: "999:999"
    environment:
      POSTGRES_DB: baton
      POSTGRES_USER: baton_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/database-admin/postgres.password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [postgres-data:/var/lib/postgresql/data, database-admin-secrets:/run/secrets/database-admin:ro]
    tmpfs: ["/tmp:size=32m,mode=1777", "/var/run/postgresql:uid=999,gid=999,mode=0700"]
    networks: [database]
    stop_grace_period: 60s
    depends_on:
      initialize: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, pg_isready, -U, baton_bootstrap, -d, baton]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  migrate:
    <<: [*service, *app]
    restart: "no"
    user: "999:999"
    command: [python, deploy/migrate.py]
    volumes: [database-admin-secrets:/run/secrets/database-admin:ro]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks: [database]
    depends_on:
      initialize: {condition: service_completed_successfully}
      database: {condition: service_healthy}
networks:
  private: {internal: true}
  database: {internal: true}
  ingress: {}
  worker-egress: {}
volumes:
  config: {}
  bridge-secrets: {}
  database-admin-secrets: {}
  database-app-secrets: {}
  codex-home: {}
  client-secrets: {}
  bridge-data: {}
  codex-data: {}
  postgres-data: {}
